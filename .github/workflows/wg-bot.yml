name: WG Gesucht Bot

on:
  schedule:
    # Pseudo-randomized 90-minute cadence during daytime.
    - cron: "7 8,11,14,17,20,23 * * 1"
      timezone: "Europe/Berlin"
    - cron: "37 9,12,15,18,21 * * 1"
      timezone: "Europe/Berlin"
    - cron: "11 8,11,14,17,20,23 * * 2"
      timezone: "Europe/Berlin"
    - cron: "41 9,12,15,18,21 * * 2"
      timezone: "Europe/Berlin"
    - cron: "4 8,11,14,17,20,23 * * 3"
      timezone: "Europe/Berlin"
    - cron: "34 9,12,15,18,21 * * 3"
      timezone: "Europe/Berlin"
    - cron: "14 8,11,14,17,20,23 * * 4"
      timezone: "Europe/Berlin"
    - cron: "44 9,12,15,18,21 * * 4"
      timezone: "Europe/Berlin"
    - cron: "9 8,11,14,17,20,23 * * 5"
      timezone: "Europe/Berlin"
    - cron: "39 9,12,15,18,21 * * 5"
      timezone: "Europe/Berlin"
    - cron: "2 8,11,14,17,20,23 * * 6"
      timezone: "Europe/Berlin"
    - cron: "32 9,12,15,18,21 * * 6"
      timezone: "Europe/Berlin"
    - cron: "16 8,11,14,17,20,23 * * 0"
      timezone: "Europe/Berlin"
    - cron: "46 9,12,15,18,21 * * 0"
      timezone: "Europe/Berlin"
  workflow_dispatch:

concurrency:
  group: wg-gesucht-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Europe/Berlin
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            python -m playwright install --with-deps chromium
          elif python -c "import sys; from pathlib import Path; from playwright.sync_api import sync_playwright; p = sync_playwright().start(); executable = Path(p.chromium.executable_path); p.stop(); sys.exit(0 if executable.exists() else 1)"
          then
            echo "Chromium already available from cache"
          else
            python -m playwright install chromium
          fi

      - name: Restore authenticated session
        run: |
          if [ -n "$WG_SESSION_JSON" ]; then
            mkdir -p auth
            printf '%s' "$WG_SESSION_JSON" > auth/session.json
            echo "Restored auth/session.json"
          else
            echo "WG_SESSION_JSON not set; continuing without restored session"
          fi
        env:
          WG_SESSION_JSON: ${{ secrets.WG_SESSION_JSON }}

      - name: Run WG Bot
        run: RUN_ONCE=true python main.py
        env:
          WG_EMAIL: ${{ secrets.WG_EMAIL }}
          WG_PASSWORD: ${{ secrets.WG_PASSWORD }}
          LISTING_IDS: ${{ secrets.LISTING_IDS }}
          HEADLESS: "true"
          DRY_RUN: "false"
          TIMEZONE: "Europe/Berlin"
          UPDATE_STRATEGY: "browser"

      - name: Persist refreshed session
        if: always()
        run: |
          if [ ! -f auth/session.json ]; then
            echo "auth/session.json not found; skipping sync"
            exit 0
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "WG_SESSION_SYNC_TOKEN not set; skipping sync"
            exit 0
          fi

          gh secret set WG_SESSION_JSON --repo "$GITHUB_REPOSITORY" < auth/session.json
          echo "Updated WG_SESSION_JSON secret"
        env:
          GH_TOKEN: ${{ secrets.WG_SESSION_SYNC_TOKEN }}
