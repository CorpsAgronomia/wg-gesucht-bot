name: WG Gesucht Bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: wg-gesucht-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      TZ: Europe/Berlin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Random skip
        id: random_skip
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import os
          import random
          import sys

          event_name = os.environ["GITHUB_EVENT_NAME"]
          force_run_after_minutes = float(os.environ.get("FORCE_RUN_AFTER_MINUTES", "30"))
          random_run_probability = float(os.environ.get("RANDOM_RUN_PROBABILITY", "0.05"))
          last_success_raw = os.environ.get("WG_LAST_SUCCESS_AT", "").strip()
          should_run = True
          gate_reason = "Manual dispatch"

          if event_name == "schedule":
              if not last_success_raw:
                  gate_reason = "No successful bump recorded yet"
              else:
                  try:
                      last_success = datetime.fromisoformat(last_success_raw.replace("Z", "+00:00"))
                  except ValueError:
                      gate_reason = f"Invalid WG_LAST_SUCCESS_AT value: {last_success_raw!r}"
                  else:
                      age_minutes = (datetime.now(timezone.utc) - last_success).total_seconds() / 60
                      if age_minutes >= force_run_after_minutes:
                          gate_reason = f"Overdue after {age_minutes:.1f} minutes"
                      elif random.random() <= random_run_probability:
                          gate_reason = f"Random pass after {age_minutes:.1f} minutes"
                      else:
                          should_run = False
                          gate_reason = f"Random skip after {age_minutes:.1f} minutes"

          if not should_run:
              print("Skipping run")
          else:
              print("Continuing execution")
          print(gate_reason)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"should_run={'true' if should_run else 'false'}\n")
              handle.write(f"gate_reason={gate_reason}\n")

          if not should_run:
              sys.exit(0)
          PY
        env:
          WG_LAST_SUCCESS_AT: ${{ vars.WG_LAST_SUCCESS_AT }}
          FORCE_RUN_AFTER_MINUTES: "30"
          RANDOM_RUN_PROBABILITY: "0.05"

      - name: Night cooldown
        if: steps.random_skip.outputs.should_run == 'true'
        id: night_cooldown
        run: |
          python - <<'PY'
          import os
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event_name = os.environ["GITHUB_EVENT_NAME"]
          now = datetime.now(ZoneInfo("Europe/Berlin"))
          should_run = event_name != "schedule" or not (2 <= now.hour <= 7)

          print(f"Europe/Berlin time: {now.isoformat()}")
          if should_run:
              print("Outside night cooldown window")
          else:
              print("Skipping run for night cooldown")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"should_run={'true' if should_run else 'false'}\n")

          if not should_run:
              sys.exit(0)
          PY

      - name: Run skipped summary
        if: steps.random_skip.outputs.should_run != 'true' || steps.night_cooldown.outputs.should_run != 'true'
        run: |
          echo "Workflow finished without running the bot."
          echo "Gate reason: $GATE_REASON"
        env:
          GATE_REASON: ${{ steps.random_skip.outputs.gate_reason }}

      - name: Setup Python
        if: steps.random_skip.outputs.should_run == 'true' && steps.night_cooldown.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.random_skip.outputs.should_run == 'true' && steps.night_cooldown.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        if: steps.random_skip.outputs.should_run == 'true' && steps.night_cooldown.outputs.should_run == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Random delay
        if: steps.random_skip.outputs.should_run == 'true' && steps.night_cooldown.outputs.should_run == 'true' && github.event_name == 'schedule'
        run: |
          python - <<'PY'
          import random
          import time

          delay = random.randint(0, 600)
          print(f"Sleeping {delay} seconds")
          time.sleep(delay)
          PY

      - name: Restore authenticated session
        if: steps.random_skip.outputs.should_run == 'true' && steps.night_cooldown.outputs.should_run == 'true'
        run: |
          if [ -n "$WG_SESSION_JSON" ]; then
            mkdir -p auth
            printf '%s' "$WG_SESSION_JSON" > auth/session.json
            echo "Restored auth/session.json"
          else
            echo "WG_SESSION_JSON not set; continuing without restored session"
          fi
        env:
          WG_SESSION_JSON: ${{ secrets.WG_SESSION_JSON }}

      - name: Run WG Bot
        if: steps.random_skip.outputs.should_run == 'true' && steps.night_cooldown.outputs.should_run == 'true'
        run: RUN_ONCE=true python main.py
        env:
          WG_EMAIL: ${{ secrets.WG_EMAIL }}
          WG_PASSWORD: ${{ secrets.WG_PASSWORD }}
          LISTING_IDS: ${{ secrets.LISTING_IDS }}
          HEADLESS: "true"
          DRY_RUN: "false"
          REFRESH_SESSION_ON_START: "true"
          TIMEZONE: "Europe/Berlin"
          PYTHONUNBUFFERED: "1"

      - name: Record successful bump time
        if: success() && steps.random_skip.outputs.should_run == 'true' && steps.night_cooldown.outputs.should_run == 'true'
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "WG_SESSION_SYNC_TOKEN not set; skipping last-success update"
            exit 0
          fi

          recorded_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh variable set WG_LAST_SUCCESS_AT --repo "$GITHUB_REPOSITORY" --body "$recorded_at"
          echo "Recorded successful bump at $recorded_at"
        env:
          GH_TOKEN: ${{ secrets.WG_SESSION_SYNC_TOKEN }}

      - name: Persist refreshed session
        if: always() && steps.random_skip.outputs.should_run == 'true' && steps.night_cooldown.outputs.should_run == 'true'
        run: |
          if [ ! -f auth/session.json ]; then
            echo "auth/session.json not found; skipping sync"
            exit 0
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "WG_SESSION_SYNC_TOKEN not set; skipping sync"
            exit 0
          fi

          gh secret set WG_SESSION_JSON --repo "$GITHUB_REPOSITORY" < auth/session.json
          echo "Updated WG_SESSION_JSON secret"
        env:
          GH_TOKEN: ${{ secrets.WG_SESSION_SYNC_TOKEN }}
