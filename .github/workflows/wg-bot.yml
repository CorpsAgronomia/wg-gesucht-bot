name: WG Gesucht Bot

on:
  schedule:
    # Pseudo-randomized ~60-minute cadence without billed in-run jitter.
    - cron: "7 7-22 * * 1"
      timezone: "Europe/Berlin"
    - cron: "11 7-22 * * 2"
      timezone: "Europe/Berlin"
    - cron: "4 7-22 * * 3"
      timezone: "Europe/Berlin"
    - cron: "14 7-22 * * 4"
      timezone: "Europe/Berlin"
    - cron: "9 7-22 * * 5"
      timezone: "Europe/Berlin"
    - cron: "2 7-22 * * 6"
      timezone: "Europe/Berlin"
    - cron: "16 7-22 * * 0"
      timezone: "Europe/Berlin"
  workflow_dispatch:

concurrency:
  group: wg-gesucht-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Europe/Berlin
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install chromium
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Restore authenticated session
        run: |
          if [ -n "$WG_SESSION_JSON" ]; then
            mkdir -p auth
            printf '%s' "$WG_SESSION_JSON" > auth/session.json
            echo "Restored auth/session.json"
          else
            echo "WG_SESSION_JSON not set; continuing without restored session"
          fi
        env:
          WG_SESSION_JSON: ${{ secrets.WG_SESSION_JSON }}

      - name: Run WG Bot
        run: RUN_ONCE=true python main.py
        env:
          WG_EMAIL: ${{ secrets.WG_EMAIL }}
          WG_PASSWORD: ${{ secrets.WG_PASSWORD }}
          LISTING_IDS: ${{ secrets.LISTING_IDS }}
          HEADLESS: "true"
          DRY_RUN: "false"
          TIMEZONE: "Europe/Berlin"
          UPDATE_STRATEGY: "browser"

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: logs/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Persist refreshed session
        if: always()
        run: |
          if [ ! -f auth/session.json ]; then
            echo "auth/session.json not found; skipping sync"
            exit 0
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "WG_SESSION_SYNC_TOKEN not set; skipping sync"
            exit 0
          fi

          gh secret set WG_SESSION_JSON --repo "$GITHUB_REPOSITORY" < auth/session.json
          echo "Updated WG_SESSION_JSON secret"
        env:
          GH_TOKEN: ${{ secrets.WG_SESSION_SYNC_TOKEN }}
